name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency: deploy

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t "${REGISTRY_IMAGE,,}:$GITHUB_SHA" .
          docker push "${REGISTRY_IMAGE,,}:$GITHUB_SHA"

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - working-directory: terraform
        run: |
          # the workspace and HOME get wiped on runner restart, RUNNER_ROOT does not
          terraform init -input=false -backend-config="path=$RUNNER_ROOT/course-reviews.tfstate"
          docker pull "${REGISTRY_IMAGE,,}:$GITHUB_SHA"
          terraform apply -input=false -auto-approve -var "image=${REGISTRY_IMAGE,,}:$GITHUB_SHA"
          curl --fail --retry 10 --retry-delay 2 http://localhost:8000/
